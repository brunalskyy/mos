# mOS: settings that keep Wi-Fi stable, mostly for the Broadcom "wl" driver (MacBook Air 2017).
# wl drops the connection when NetworkManager changes the MAC address while scanning,
# when power saving kicks in, and when routers ask for protected management frames.
[device]
wifi.scan-rand-mac-address=no
wifi.backend=wpa_supplicant

[connection]
wifi.powersave=2
wifi.cloned-mac-address=preserve
wifi-sec.pmf=1
