# mOS: settings that keep Wi-Fi stable, mostly for the Broadcom "wl" driver (MacBook Air 2017).
# wl drops the connection when NetworkManager changes the MAC address while scanning
# and when power saving kicks in.
# Protected management frames are NOT switched off for every network any more (0.7 did
# that and some routers then refused to connect); mOS Settings only turns them off for a
# network as a fallback when it won't connect otherwise.
[device]
wifi.scan-rand-mac-address=no
wifi.backend=wpa_supplicant

[connection]
wifi.powersave=2
wifi.cloned-mac-address=preserve
