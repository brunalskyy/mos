# mOS: the mOS password pop-up goes first. KDE's dialog only starts if the mOS one
# isn't running (it didn't start, it stopped, or you chose the classic dialog).
[Unit]
Wants=mos-polkit-agent.service
After=mos-polkit-agent.service

[Service]
ExecCondition=/bin/sh -c '! busctl --user status org.mos.PolkitAgent >/dev/null 2>&1'
