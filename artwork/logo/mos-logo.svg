<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="sq">
      <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#3B5BFD"/>
      <stop offset="1" stop-color="#06B6A4"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#F0ABFC" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F0ABFC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frameRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="glassFill" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="780">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="230" y1="290" x2="790" y2="780">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.8" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <mask id="rimMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <path d="M300 680 V450 A106 106 0 0 1 512 450 V680 M512 450 A106 106 0 0 1 724 450 V680" fill="none" stroke="#FFFFFF" stroke-width="132" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M300 680 V450 A106 106 0 0 1 512 450 V680 M512 450 A106 106 0 0 1 724 450 V680" fill="none" stroke="#000000" stroke-width="114" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
    <mask id="innerShade" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <path d="M300 680 V450 A106 106 0 0 1 512 450 V680 M512 450 A106 106 0 0 1 724 450 V680" fill="none" stroke="#FFFFFF" stroke-width="132" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <g clip-path="url(#sq)">
    <!-- background -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glowA)"/>
    <rect width="1024" height="1024" fill="url(#glowB)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>

    <!-- glyph shadow -->
    <path d="M300 680 V450 A106 106 0 0 1 512 450 V680 M512 450 A106 106 0 0 1 724 450 V680" transform="translate(0 30)" fill="none" stroke="#1E1B4B" stroke-opacity="0.45" stroke-width="132" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

    <!-- refraction: background bent inside the glass -->
    <g mask="url(#innerShade)">
      <g transform="translate(512 512) scale(1.35) rotate(18) translate(-512 -512)">
        <rect width="1024" height="1024" fill="url(#bg)"/>
        <rect width="1024" height="1024" fill="url(#glowA)"/>
        <rect width="1024" height="1024" fill="url(#glowB)"/>
      </g>
    </g>

    <!-- glass body -->
    <path d="M300 680 V450 A106 106 0 0 1 512 450 V680 M512 450 A106 106 0 0 1 724 450 V680" fill="none" stroke="url(#glassFill)" stroke-width="132" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- inner bottom shade, gives thickness -->
    <g mask="url(#innerShade)">
      <path d="M300 680 V450 A106 106 0 0 1 512 450 V680 M512 450 A106 106 0 0 1 724 450 V680" transform="translate(10 18)" fill="none" stroke="#312E81" stroke-opacity="0.12" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" filter="url(#softer)"/>
    </g>

    <!-- bright rim -->
    <rect width="1024" height="1024" fill="url(#rim)" mask="url(#rimMask)"/>

    <!-- specular highlights -->
    <path d="M262 425 A146 146 0 0 1 370 312" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M478 336 A146 146 0 0 1 560 307" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="12" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M254 470 V600" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M770 610 V700" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round" filter="url(#soft)"/>

    <!-- icon frame rim -->
    <rect x="5" y="5" width="1014" height="1014" rx="227" ry="227" fill="none" stroke="url(#frameRim)" stroke-width="10"/>
  </g>
</svg>
