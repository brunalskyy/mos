name: Build mOS ISO

on:
  push:
    branches: [main]
    paths:
      - "build/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Build the ISO in a Debian 13 container
        run: |
          sudo docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work/build \
            debian:trixie \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap ca-certificates \
                squashfs-tools xorriso mtools dosfstools cpio \
                grub-efi-amd64-bin grub-pc-bin syslinux syslinux-common isolinux
              lb --version
              chmod +x auto/* config/hooks/normal/*.hook.*
              lb clean --purge || true
              lb config
              lb build
              ls -lh *.iso
            '

      - name: Collect results
        if: always()
        run: |
          mkdir -p out
          sudo cp build/*.iso out/ 2>/dev/null || true
          sudo cp build/build.log out/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" out
          cd out
          ls ./*.iso >/dev/null 2>&1 && sha256sum ./*.iso > SHA256SUMS || echo "No ISO was produced"
          ls -lh

      - name: Prepare release files (GitHub release files must be under 2 GiB)
        run: |
          iso=$(ls out/*.iso)
          size=$(stat -c %s "${iso}")
          echo "ISO size: ${size} bytes"
          echo "Non-zero bytes in the last 64 MiB (0 means it is padding):"
          tail -c 67108864 "${iso}" | tr -d '\000' | wc -c
          mkdir -p out/release
          if [ "${size}" -lt 2147483648 ]; then
            cp "${iso}" out/release/
          else
            echo "The ISO is 2 GiB or more, so the release gets a compressed copy (.iso.xz)."
            xz -T0 -3 -k -c "${iso}" > "out/release/$(basename "${iso}").xz"
          fi
          cd out/release
          sha256sum ./* > SHA256SUMS
          ls -l

      - name: Upload the ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mos-amber-0.1
          path: |
            out/*.iso
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build.log
          retention-days: 14

      - name: Publish the pre-release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.1-amber-preview
        run: |
          notes=$(cat <<'NOTES'
          **mOS 1.0 Amber, 0.1.1 preview.** The first bootable mOS. This is a preview, not a finished release.

          If the file ends in .iso.xz, extract it first (7-Zip on Windows, or double-click on a Mac). balenaEtcher can flash the .xz directly.

          What's in it:
          - mOS name and logo (Settings > About says mOS 1.0 Amber)
          - mOS icons for Files, Settings, Software, Terminal, Calculator, Clock, Calendar and Photos
          - mOS installer (Install mOS)
          - mOS boot menu, boot animation and wallpaper
          - GNOME desktop, Chromium, and the app store with Flathub
          - Wi-Fi driver for the MacBook Air (2017)
          - VMware tools

          Not in it yet: the Material 3 theme (0.2), control centre and dock (0.3), lock screen and widgets (0.4), setup wizard (0.5).

          How to try it:
          - VMware: new VM, choose this ISO, Linux > Debian 12.x 64-bit, 4 GB RAM, 2 cores, firmware UEFI
          - USB: write the ISO with balenaEtcher, then on a Mac hold Option at startup and pick the EFI Boot drive

          It runs live: nothing on your computer changes, and nothing is kept after a reboot.
          NOTES
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/release/* --clobber
            gh release edit "${TAG}" --prerelease --notes "${notes}"
          else
            gh release create "${TAG}" out/release/* \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "mOS 1.0 Amber (0.1.1 preview)" \
              --notes "${notes}"
          fi
