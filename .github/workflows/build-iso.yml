name: Build mOS ISO

on:
  push:
    branches: [main]
    paths:
      - "build/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Build the ISO in a Debian 13 container
        run: |
          sudo docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work/build \
            debian:trixie \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap ca-certificates \
                squashfs-tools xorriso mtools dosfstools cpio \
                grub-efi-amd64-bin grub-pc-bin syslinux syslinux-common isolinux
              lb --version
              chmod +x auto/* config/hooks/normal/*.hook.*
              lb clean --purge || true
              lb config
              lb build
              ls -lh *.iso
            '

      - name: Collect results
        if: always()
        run: |
          mkdir -p out
          sudo cp build/*.iso out/ 2>/dev/null || true
          sudo cp build/build.log out/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" out
          cd out
          ls ./*.iso >/dev/null 2>&1 && sha256sum ./*.iso > SHA256SUMS || echo "No ISO was produced"
          ls -lh
          name=$(find . -maxdepth 1 -name '*.iso' -printf '%f\n' | head -n 1 | sed 's/-amd64.hybrid.iso$//')
          echo "ISO_NAME=${name:-mos-iso}" >> "$GITHUB_ENV"

      - name: Prepare release files (GitHub release files must be under 2 GiB)
        run: |
          iso=$(ls out/*.iso)
          size=$(stat -c %s "${iso}")
          echo "ISO size: ${size} bytes"
          echo "Non-zero bytes in the last 64 MiB (0 means it is padding):"
          tail -c 67108864 "${iso}" | tr -d '\000' | wc -c
          mkdir -p out/release
          if [ "${size}" -lt 2147483648 ]; then
            cp "${iso}" out/release/
          else
            echo "The ISO is 2 GiB or more, so the release gets it as a 7-Zip archive in parts."
            command -v 7z >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y p7zip-full; }
            7z a -t7z -mx=1 -v1900m "out/release/$(basename "${iso}" .iso).7z" "${iso}"
          fi
          cd out/release
          sha256sum ./* > SHA256SUMS
          ls -l

      - name: Upload the ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: |
            out/*.iso
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build.log
          retention-days: 14

      - name: Publish the pre-release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.4.0-amber-preview
        run: |
          notes=$(cat <<'NOTES'
          **mOS 1.0 Amber, 0.4 preview.** This is a preview, not a finished release.

          New in 0.4:
          - New Settings app in Material 3 style: Wallpaper & style, Icon shape, Wi-Fi, Bluetooth, Display, Sound, About mOS and more
          - Pixel-style lock screen clock: big stacked numbers, minutes in your accent colour
          - Icon shapes: circle (default), squircle or rounded square; pick one in Settings
          - Every app icon follows the shape, including apps you install later
          - Icons now have clean edges (no square corners)
          - 3 new wallpapers mixing macOS and Windows styles: Horizon, Glow and Amber Night
          - mOS Account app (sign in with Google, email or phone)

          The ISO is split into parts (.7z.001, .7z.002). Download all of them into one folder, then open the .7z.001 file with 7-Zip (Windows) or Keka (Mac) and extract: you get the .iso.

          What's in it:
          - KDE Plasma 6 with a Windows 10-style taskbar: mOS Start button, apps, system tray, time and date, show-desktop corner
          - macOS-style windows with round red, yellow and green buttons on the left
          - Colours that follow your wallpaper (accent colour from the wallpaper)
          - Desktop icons and desktop widgets (clock, calendar, notes)
          - New liquid glass mOS icons
          - mOS name, logo, wallpaper, boot menu, boot animation and installer
          - Chromium, Dolphin (files), Discover with Flathub (app store), Konsole, KWrite, KCalc, Gwenview, KClock
          - Wi-Fi driver for the MacBook Air (2017), VMware tools

          Not in it yet: see-through sidebars in apps, the stacked lock screen clock, the setup wizard.

          How to try it:
          - VMware: new VM, choose this ISO, Linux > Debian 12.x 64-bit, 4 GB RAM, 2 cores, firmware UEFI
          - USB: write the ISO with balenaEtcher, then on a Mac hold Option at startup and pick the EFI Boot drive

          It runs live: nothing on your computer changes, and nothing is kept after a reboot.
          NOTES
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/release/* --clobber
            gh release edit "${TAG}" --prerelease --notes "${notes}"
          else
            gh release create "${TAG}" out/release/* \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "mOS 1.0 Amber (0.4 preview)" \
              --notes "${notes}"
          fi
