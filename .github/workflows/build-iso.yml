name: Build mOS ISO

on:
  push:
    branches: [main]
    paths:
      - "build/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Build the mOS update package (mos-desktop .deb)
        run: |
          build/make-deb.sh out/deb
          # Put it in the ISO too, so installed computers know which mOS they have
          mkdir -p build/config/packages.chroot
          cp out/deb/*.deb build/config/packages.chroot/
          echo "MOS_VERSION=$(python3 -c 'import json;print(json.load(open("build/config/includes.chroot/usr/share/mos/version"))["version"])')" >> "$GITHUB_ENV"

      - name: Build the ISO in a Debian 13 container
        run: |
          sudo docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work/build \
            debian:trixie \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap ca-certificates \
                squashfs-tools xorriso mtools dosfstools cpio \
                grub-efi-amd64-bin grub-pc-bin syslinux syslinux-common isolinux
              lb --version
              chmod +x auto/* config/hooks/normal/*.hook.*
              lb clean --purge || true
              lb config
              lb build
              ls -lh *.iso
            '

      - name: Collect results
        if: always()
        run: |
          mkdir -p out
          sudo cp build/*.iso out/ 2>/dev/null || true
          sudo cp build/build.log out/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" out
          cd out
          ls ./*.iso >/dev/null 2>&1 && sha256sum ./*.iso > SHA256SUMS || echo "No ISO was produced"
          ls -lh
          name=$(find . -maxdepth 1 -name '*.iso' -printf '%f\n' | head -n 1 | sed 's/-amd64.hybrid.iso$//')
          echo "ISO_NAME=${name:-mos-iso}" >> "$GITHUB_ENV"

      - name: Prepare release files (GitHub release files must be under 2 GiB)
        run: |
          iso=$(ls out/*.iso)
          size=$(stat -c %s "${iso}")
          echo "ISO size: ${size} bytes"
          echo "Non-zero bytes in the last 64 MiB (0 means it is padding):"
          tail -c 67108864 "${iso}" | tr -d '\000' | wc -c
          mkdir -p out/release
          cp out/deb/*.deb out/release/
          if [ "${size}" -lt 2147483648 ]; then
            cp "${iso}" out/release/
          else
            echo "The ISO is 2 GiB or more, so the release gets it as a 7-Zip archive in parts."
            command -v 7z >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y p7zip-full; }
            7z a -t7z -mx=1 -v1900m "out/release/$(basename "${iso}" .iso).7z" "${iso}"
          fi
          cd out/release
          sha256sum ./* > SHA256SUMS
          ls -l

      - name: Upload the ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: |
            out/*.iso
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build.log
          retention-days: 14

      - name: Publish the release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.6 -> v0.6.0-amber, 0.6.1 -> v0.6.1-amber
          case "${MOS_VERSION}" in *.*.*) TAG="v${MOS_VERSION}-amber" ;; *) TAG="v${MOS_VERSION}.0-amber" ;; esac
          TITLE="$(python3 -c 'import json;print(json.load(open("build/config/includes.chroot/usr/share/mos/version"))["name"])')"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          # Every build is a pre-release until the full mOS 1.0 Amber ("prerelease": false in the version file)
          PRE="$(python3 -c 'import json;print("--prerelease" if json.load(open("build/config/includes.chroot/usr/share/mos/version")).get("prerelease", True) else "--latest")')"
          if [ "${PRE}" = "--prerelease" ]; then TITLE="${TITLE%)} preview)"; fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/release/* --clobber
            gh release edit "${TAG}" ${PRE} --title "${TITLE}" --notes-file build/release-notes.md
          else
            gh release create "${TAG}" out/release/* ${PRE} \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes-file build/release-notes.md
          fi

      - name: Publish the update list (Software update reads this)
        if: success() && github.ref == 'refs/heads/main'
        run: |
          deb=$(ls out/deb/*.deb)
          python3 - "${deb}" <<'PY'
          import hashlib, json, os, sys
          deb = sys.argv[1]
          v = json.load(open("build/config/includes.chroot/usr/share/mos/version"))
          entry = {
              "version": v["version"], "build": v["build"], "name": v["name"], "notes": v.get("notes", []),
              "deb": f"https://github.com/brunalskyy/mos/releases/download/{os.environ['TAG']}/{os.path.basename(deb)}",
              "sha256": hashlib.sha256(open(deb, "rb").read()).hexdigest(),
              "size": os.path.getsize(deb),
          }
          os.makedirs("updates", exist_ok=True)
          for channel in ("stable", "insider"):
              json.dump(entry, open(f"updates/{channel}.json", "w"), indent=2)
          print(json.dumps(entry, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/
          git commit -m "Update list: ${MOS_VERSION}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
          # Pushes made by this workflow don't start a Pages build on their own, so ask for one
          GH_TOKEN="${{ github.token }}" gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
