name: Check mOS Liquid Glass builds

on:
  push:
    branches-ignore: [main]
    paths:
      - "build/glass/**"
      - "build/make-glass.sh"
      - ".github/workflows/glass-check.yml"
  workflow_dispatch:

jobs:
  glass:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the effect in Debian 13
        run: |
          sudo docker run --rm -v "${GITHUB_WORKSPACE}:/work" -w /work debian:trixie \
            sh -euc 'build/make-glass.sh /work/out/glass'
      - uses: actions/upload-artifact@v4
        with:
          name: mos-glass
          path: out/glass/
          retention-days: 7
